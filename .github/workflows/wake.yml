# Starts the daily forecast job in the private repo at the right time, so tomorrow's forecast is made before the
# noon day-ahead auction. GitHub starts scheduled workflows hours late, so this one is scheduled several times
# through the night (UTC) and then waits: the first run that arrives early enough sleeps until 09:20 Amsterdam,
# starts the job, and at 10:35 starts it once more for zones whose inputs were still missing. Runs that arrive when
# tomorrow's forecast is already complete do nothing. Minutes are free in a public repo.
# Needs secret DISPATCH_TOKEN: a fine-grained token with "Actions: read and write" on weather-power-forecast only.
name: wake forecast job
on:
  schedule:
    - cron: "0 20 * * *"
    - cron: "0 22 * * *"
    - cron: "0 0 * * *"
    - cron: "0 2 * * *"
    - cron: "0 4 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
concurrency:
  group: wake
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      TZ: Europe/Amsterdam
    steps:
      - name: Wait for the right moment and start the forecast job
        run: |
          set -u
          if [ -z "$TOKEN" ]; then echo "::warning::secret DISPATCH_TOKEN is missing: nothing started"; exit 0; fi
          api=https://api.github.com/repos/Karel-deVries/weather-power-forecast/actions/workflows/live.yml/dispatches
          start_job() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" "$api" -d '{"ref":"main","inputs":{"final":"false"}}')
            echo "$(date '+%F %H:%M %Z') started the forecast job (HTTP $code)"
            [ "$code" = 204 ]
          }
          tomorrow=$(date -d tomorrow +%F)
          # Is tomorrow's forecast complete on the published page? (every zone "ok" or "already forecast")
          complete() {
            curl -s "https://raw.githubusercontent.com/Karel-deVries/power-forecast-live/main/data/zones.json?$(date +%s)" |
              jq -e --arg d "$tomorrow" '.status.date == $d and ([.status.zones[] | test("^(ok|already)")] | all)' > /dev/null
          }
          at() { echo $(( $(date -d "today $1" +%s) - $(date +%s) )); }   # seconds until a time today (Amsterdam)
          if complete; then echo "tomorrow ($tomorrow) is already forecast: nothing to do"; exit 0; fi
          if [ "$(at 11:45)" -le 0 ]; then echo "past 11:45: too late for this auction, leaving it to the late runs"; exit 0; fi
          first=$(at 09:20)
          if [ "$first" -gt $((330 * 60)) ]; then echo "too early to wait here ($((first / 60)) min); a later run takes over"; exit 0; fi
          if [ "$first" -gt 0 ]; then echo "waiting $((first / 60)) min until 09:20"; sleep "$first"; fi
          complete || start_job
          second=$(at 10:35)
          if [ "$second" -gt 0 ]; then echo "waiting $((second / 60)) min until 10:35"; sleep "$second"; fi
          # The first job may still be running; the private repo queues runs, so starting another one is harmless.
          sleep 120
          complete && echo "tomorrow is complete" || start_job
